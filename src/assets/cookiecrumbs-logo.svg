  <circle cx="38" cy="22" r="2.5" fill="#451a03" />
  <circle cx="42" cy="34" r="3" fill="#451a03" />
  <circle cx="28" cy="40" r="2.5" fill="#451a03" />
  <circle cx="34" cy="46" r="2" fill="#451a03" />
  <!-- Shield badge -->
