<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CookieCrumbs logo">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="crumb" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>
  </defs>
  <!-- Shield -->
  <path d="M32 4 L56 14 V34 C56 48 32 60 32 60 C32 60 8 48 8 34 V14 Z"
        fill="url(#shield)" stroke="#1e3a8a" stroke-width="2" stroke-linejoin="round" />
  <!-- Cookie -->
  <circle cx="32" cy="34" r="13" fill="url(#crumb)" stroke="#78350f" stroke-width="1.5" />
  <!-- Chips -->
  <circle cx="27" cy="30" r="2" fill="#451a03" />
  <circle cx="36" cy="29" r="1.6" fill="#451a03" />
  <circle cx="38" cy="37" r="2" fill="#451a03" />
  <circle cx="29" cy="39" r="1.6" fill="#451a03" />
  <!-- Crumb trail dots -->
  <circle cx="18" cy="20" r="1.4" fill="#fbbf24" opacity="0.85" />
  <circle cx="47" cy="22" r="1.2" fill="#fbbf24" opacity="0.85" />
  <circle cx="50" cy="46" r="1.3" fill="#fbbf24" opacity="0.85" />
  <circle cx="15" cy="44" r="1.1" fill="#fbbf24" opacity="0.85" />
</svg>
